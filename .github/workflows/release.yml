name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AudioMonitor/AudioMonitor.csproj

      - name: Publish application
        run: |
          dotnet publish AudioMonitor/AudioMonitor.csproj \
            -c Release \
            -f net8.0-windows \
            --self-contained false \
            -o publish

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\AudioMonitor-v1.0-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: v1.0
          draft: false
          generate_release_notes: true
          files: |
            AudioMonitor-v1.0-win-x64.zip
